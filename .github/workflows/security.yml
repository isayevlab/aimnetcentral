name: Security

on:
    push:
        branches: [main]
        paths: ["**/*.py", ".github/workflows/security.yml"]
    pull_request:
        paths: ["**/*.py", ".github/workflows/security.yml"]
    schedule:
        - cron: "0 6 * * 2" # Tuesdays 06:00 UTC

# CodeQL is not a required check, so path filtering cannot block a merge.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [python]
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4.38.2
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@v4.38.2
              with:
                  category: "/language:${{ matrix.language }}"
