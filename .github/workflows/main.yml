name: Main

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

# A newer push to a PR cancels its running CI. On main, a run in progress
# finishes and only queued intermediate runs are replaced by the newest one.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI tiers. A PR runs the bracketing versions (Python 3.11 and 3.14, torch 2.10
# and 2.15). Pushes to main, manual dispatches, and PRs labeled `ci:full` run
# the full matrix. Docs-only PRs skip the test jobs, and draft PRs skip them
# until marked ready. `ci-ok` is the only required status check, so jobs can be
# skipped or renamed without touching branch protection.
jobs:
    changes:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            code: ${{ steps.filter.outputs.code }}
            full: ${{ steps.filter.outputs.full }}
        steps:
            - id: filter
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  PR: ${{ github.event.pull_request.number }}
                  LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
              run: |
                  set -euo pipefail
                  code=true
                  full=false
                  if [ "$EVENT" != "pull_request" ] || [[ ",$LABELS," == *",ci:full,"* ]]; then
                    full=true
                  fi
                  if [ "$EVENT" = "pull_request" ]; then
                    files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
                    # Skip the test jobs only when every changed file is documentation.
                    if ! grep -qvE '^(docs/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|LICENSE$|mkdocs\.yml$)' <<<"$files"; then
                      code=false
                    fi
                  fi
                  echo "code=$code full=$full"
                  echo "code=$code" >> "$GITHUB_OUTPUT"
                  echo "full=$full" >> "$GITHUB_OUTPUT"

    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - uses: actions/cache@v6
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  groups: dev

            - name: Run checks
              run: make check

    check-docs:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  groups: docs

            - name: Check if documentation can be built
              run: uv run mkdocs build -s

    tests-wheel:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # hatch-vcs needs tags for the version
            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.11"
            - uses: astral-sh/setup-uv@v10.3.3
            - name: Build distributable wheel from sdist
              run: uv build
            - name: Install wheel with the minimum supported Torch on CPU
              run: |
                  uv venv --python 3.11 .wheel-smoke
                  uv pip install --python .wheel-smoke/bin/python "torch==2.10.*" \
                      --index-url https://download.pytorch.org/whl/cpu
                  uv pip install --python .wheel-smoke/bin/python dist/*.whl
                  uv pip check --python .wheel-smoke/bin/python
            - name: Exercise installed package outside the source tree
              env:
                  CUDA_VISIBLE_DEVICES: ""
                  OMP_NUM_THREADS: "1"
                  MKL_NUM_THREADS: "1"
              run: |
                  cd "$RUNNER_TEMP"
                  "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -I \
                      "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

    tests-core:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 12
        strategy:
            matrix:
                python-version: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.11", "3.13", "3.14"]' || '["3.11", "3.14"]') }}
            fail-fast: false
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  python-version: ${{ matrix.python-version }}
                  groups: dev

            - name: Cache model weights
              id: weights
              uses: actions/cache@v6
              with:
                  path: ~/.cache/aimnet
                  key: aimnet-weights-${{ hashFiles('aimnet/calculators/model_registry.yaml') }}

            - name: Pre-fetch model weights (cache miss only)
              if: steps.weights.outputs.cache-hit != 'true'
              run: uv run aimnet download --all

            - name: Run tests
              run: uv run pytest tests -m "not gpu and not network and not ase and not pysis and not train and not hf and not torch_sim and not slow"

    # Probes torch-core API + CPU-numerics drift across the supported range.
    # NOT a dependency-graph test: torch is reinstalled on top of the locked
    # warp-lang/nvalchemiops (which do not pin torch), and CI is CPU-only so the
    # Warp execution kernels never run. The warp/nvalchemiops coupling is
    # validated on GPU (see the GPU validation task).
    #
    # torch.compile/inductor is DISABLED here (TORCHDYNAMO_DISABLE=1): reinstalling
    # torch alone leaves a mismatched triton, so the inductor path cannot be tested
    # coherently via reinstall-on-top (it can break with a `triton_key` ImportError).
    # The compile path's cross-version validation belongs in a
    # resolver-coherent env, not this eager API/numerics probe.
    #
    # The locked torch (2.14) is left out: tests-core already runs it.
    tests-torch:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 12
        strategy:
            matrix:
                torch-version: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["2.10.*", "2.11.*", "2.12.*", "2.13.*", "2.15.*"]' || '["2.10.*", "2.15.*"]') }}
            fail-fast: false
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  python-version: "3.11"
                  groups: dev

            - name: Override torch (CPU wheel) — desyncs from uv.lock, intentional
              env:
                  TORCH_VERSION: ${{ matrix.torch-version }}
                  UV_NO_SYNC: "1"
              run: |
                  set -e
                  uv pip install --python .venv/bin/python --reinstall-package torch \
                      "torch==${TORCH_VERSION}" \
                      --index-url https://download.pytorch.org/whl/cpu
                  uv run --no-sync python -c "import torch; print('torch', torch.__version__)"

            - name: Cache model weights
              id: weights
              uses: actions/cache@v6
              with:
                  path: ~/.cache/aimnet
                  key: aimnet-weights-${{ hashFiles('aimnet/calculators/model_registry.yaml') }}

            - name: Run core tests against torch ${{ matrix.torch-version }}
              env:
                  UV_NO_SYNC: "1"
                  # Eager only: see job comment — inductor/triton can't be tested via reinstall-on-top.
                  TORCHDYNAMO_DISABLE: "1"
                  WEIGHTS_CACHED: ${{ steps.weights.outputs.cache-hit }}
              run: |
                  if [ "$WEIGHTS_CACHED" != "true" ]; then uv run --no-sync aimnet download --all; fi
                  uv run --no-sync pytest tests \
                      -m "not gpu and not network and not ase and not pysis and not train and not hf and not torch_sim and not slow"

    # One environment with every extra. The marker expression is the union of
    # the former per-extra jobs, minus the GPU-marked ASE tests (tests-pbc-cpu).
    # The bare markers deliberately include slow-, gpu- and network-marked tests
    # of each extra (TorchSim energy/stress smoke, HF loading); GPU-only tests
    # skip themselves without CUDA. TorchSim needs Python 3.12+, so its tests
    # skip on 3.11.
    tests-extras:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                python-version: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.11", "3.12", "3.14"]' || '["3.11", "3.14"]') }}
            fail-fast: false
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  python-version: ${{ matrix.python-version }}
                  groups: dev
                  extras: ase,train,pysis,sella,hf,torchsim

            - name: Restore model weights
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/aimnet
                  key: aimnet-weights-${{ hashFiles('aimnet/calculators/model_registry.yaml') }}

            - name: Run extras tests
              run: uv run pytest tests -m "(ase and not gpu and not slow) or train or pysis or sella or hf or torch_sim"

    # GPU-marked periodic tests (PBC, Ewald, PME, DSF) run on CPU. This is CI's
    # only run of tests/test_pbc.py; it is the slowest test set, so it gets its
    # own job in parallel with the others.
    tests-pbc-cpu:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  python-version: "3.11"
                  groups: dev
                  extras: ase

            - name: Restore model weights
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/aimnet
                  key: aimnet-weights-${{ hashFiles('aimnet/calculators/model_registry.yaml') }}

            - name: Run GPU-marked ASE tests on CPU
              env:
                  CUDA_VISIBLE_DEVICES: ""
              run: uv run pytest tests -m "ase and gpu and not sella and not slow"

    # The single required status check. Fails if any needed job failed or was
    # cancelled; skipped jobs (docs-only or draft PRs) count as passing.
    ci-ok:
        if: always()
        needs:
            [
                changes,
                quality,
                check-docs,
                tests-wheel,
                tests-core,
                tests-torch,
                tests-extras,
                tests-pbc-cpu,
            ]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: All required jobs passed or were skipped
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  echo "needs results: $RESULTS"
                  case " $RESULTS " in
                    *" failure "*|*" cancelled "*) exit 1 ;;
                  esac

    deploy-docs:
        needs: ci-ok
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Fetch all history and tags for hatch-vcs

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  groups: "dev,docs"

            - name: Deploy documentation
              run: uv run mkdocs gh-deploy --force
