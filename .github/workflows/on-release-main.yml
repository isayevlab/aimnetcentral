name: release-main

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag to publish, e.g. v0.2.5"
                required: true
                type: string

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Fetch all history and tags for hatch-vcs
                  ref: ${{ env.RELEASE_TAG }}

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env

            - name: Verify release tag checkout
              run: |
                  set -euo pipefail
                  test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"

            - name: Build and publish
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
              run: |
                  uv build
                  python - <<'PY'
                  import os
                  import re

                  tag = os.environ["RELEASE_TAG"].removeprefix("v")
                  files = os.listdir("dist")
                  pattern = re.compile(rf"aimnet-{re.escape(tag)}(?:\.|-)")
                  if not any(pattern.match(name) for name in files):
                      raise SystemExit(f"dist artifacts {files!r} do not match release tag {tag!r}")
                  PY
                  uv publish

    deploy-docs:
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Fetch all history and tags for hatch-vcs
                  ref: ${{ env.RELEASE_TAG }}

            - name: Set up the environment
              uses: ./.github/actions/setup-uv-env
              with:
                  groups: "dev,docs"

            - name: Deploy documentation
              run: uv run mkdocs gh-deploy --force
